<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Best XI · redesign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* design-canvas surface tweak — sit a touch darker than the warm gray
       default so the dark mocks aren't sitting on a pale background. */
    body.dc-host { background: #1a1c22 !important; }

    /* Make the canvas artboard inner background match the app bg so the app
       sits flush inside the artboard frame. */
    .dc-artboard__body { background: var(--bg) !important; }
  </style>
</head>
<body class="dc-host">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="chips.jsx"></script>
  <script type="text/babel" src="filters.jsx"></script>
  <script type="text/babel" src="pitch.jsx"></script>
  <script type="text/babel" src="detail.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "tone": "grass",
      "accent": "#C4F542",
      "showName": true,
      "showTeam": true
    }/*EDITMODE-END*/;

    function Root() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Drive the global --accent var from the tweak.
      useEffect(() => {
        document.documentElement.style.setProperty("--accent", t.accent);
      }, [t.accent]);

      return (
        <React.Fragment>
          <DesignCanvas>
            <DCSection
              id="variants"
              title="Best XI · dos direcciones para el chip de jugador"
              subtitle="Mismo layout, mismo flujo. Cambia cómo se representa a cada jugador en la cancha."
            >
              <DCArtboard id="v-pill" label="A · Pill refinado" width={1320} height={920}>
                <App chip="pill" label="Variante A" tweaks={t} />
              </DCArtboard>
              <DCArtboard id="v-card" label="B · Mini-card" width={1320} height={920}>
                <App chip="card" label="Variante B" tweaks={t} />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel>
            <TweakSection label="Cancha" />
            <TweakRadio
              label="Tono"
              value={t.tone}
              options={["night", "grass", "noir"]}
              onChange={(v) => setTweak("tone", v)}
            />
            <TweakColor
              label="Acento"
              value={t.accent}
              options={["#C4F542", "#34D399", "#7AC8FF", "#F472B6", "#FBBF24"]}
              onChange={(v) => setTweak("accent", v)}
            />
            <TweakSection label="Chip de jugador" />
            <TweakToggle
              label="Mostrar nombre"
              value={t.showName}
              onChange={(v) => setTweak("showName", v)}
            />
            <TweakToggle
              label="Mostrar club"
              value={t.showTeam}
              onChange={(v) => setTweak("showTeam", v)}
            />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
